<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Illustration of the overlay: a column of window thumbnails on the right edge of each of three monitors">
<defs>
<linearGradient id="bgd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151a24"/><stop offset="1" stop-color="#0e121a"/></linearGradient>
<style>
