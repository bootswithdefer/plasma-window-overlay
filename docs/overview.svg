<text class="cap" x="60" y="560">Illustration only: mock windows and approximate layout, not a real screenshot.</text>
<text class="cap" x="60" y="584">Each monitor gets its own translucent column listing just that screen's windows;</text>
<text class="cap" x="60" y="604">the highlighted tile is the focused window, and clicking a tile focuses it.</text>
