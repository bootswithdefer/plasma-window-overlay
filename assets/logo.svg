<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Plasma Window Overlay logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#2f3b52"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a66"/>
      <stop offset="1" stop-color="#26324a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- monitor -->
  <rect x="30" y="58" width="196" height="128" rx="14" fill="url(#screen)" stroke="#3daee9" stroke-width="7"/>
  <rect x="106" y="190" width="44" height="10" rx="3" fill="#3daee9"/>
  <rect x="86" y="200" width="84" height="9" rx="4.5" fill="#3daee9"/>
  <!-- the maximized window behind the overlay -->
  <rect x="42" y="70" width="108" height="104" rx="6" fill="#ffffff" fill-opacity="0.10"/>
  <rect x="42" y="70" width="108" height="14" rx="6" fill="#ffffff" fill-opacity="0.16"/>
  <!-- overlay column: three translucent thumbnails on the right edge -->
  <g filter="url(#glow)">
    <rect x="158" y="72" width="56" height="32" rx="5" fill="#3daee9" fill-opacity="0.95" stroke="#bfe6fa" stroke-width="2"/>
    <rect x="158" y="110" width="56" height="32" rx="5" fill="#ffffff" fill-opacity="0.62"/>
    <rect x="158" y="148" width="56" height="26" rx="5" fill="#ffffff" fill-opacity="0.34"/>
  </g>
  <!-- tiny title bars on the thumbnails -->
  <rect x="164" y="96" width="26" height="3" rx="1.5" fill="#0d3a52" fill-opacity="0.7"/>
  <rect x="164" y="134" width="22" height="3" rx="1.5" fill="#1b2230" fill-opacity="0.45"/>
  <rect x="164" y="166" width="18" height="3" rx="1.5" fill="#1b2230" fill-opacity="0.35"/>
</svg>
